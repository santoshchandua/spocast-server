# Optional real PostgreSQL for local development. Embedded mode needs no Docker.
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: cricket_pulse
      POSTGRES_USER: pulse_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique local database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pulse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse_owner -d cricket_pulse"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pulse_data:
